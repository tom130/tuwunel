<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Approve QR login</title>
	<style>
		body { margin: 0; font: 16px/1.45 system-ui, sans-serif; color: #1f2328; background: #f6f8fa; }
		main { max-width: 28rem; margin: 8vh auto; padding: 2rem; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; }
		h1 { margin: 0 0 1rem; font-size: 1.5rem; }
		label { display: block; margin-top: 1rem; font-weight: 600; }
		input { width: 100%; box-sizing: border-box; margin-top: .35rem; padding: .65rem; border: 1px solid #8c959f; border-radius: 6px; font: inherit; }
		button, .sso { display: inline-block; box-sizing: border-box; width: 100%; margin-top: 1rem; padding: .7rem .9rem; border: 0; border-radius: 6px; background: #0969da; color: #fff; font: inherit; font-weight: 700; text-align: center; text-decoration: none; cursor: pointer; }
		.meta { color: #57606a; }
		.error { color: #cf222e; font-weight: 700; }
	</style>
</head>
<body>
	<main>
		<h1>Approve QR login</h1>
		<p class="meta">Code <strong>{{USER_CODE}}</strong> for device <strong>{{DEVICE_ID}}</strong></p>
		{{ERROR}}
		<form method="post" action="/_tuwunel/oauth/link">
			<input type="hidden" name="action" value="login">
			<input type="hidden" name="user_code" value="{{USER_CODE}}">
			<label>Username
				<input name="username" autocomplete="username" required>
			</label>
			<label>Password
				<input name="password" type="password" autocomplete="current-password" required>
			</label>
			<button type="submit">Sign in</button>
		</form>
		{{SSO_LINKS}}
	</main>
</body>
</html>
